[project]
name = "tft-assistant"
version = "0.1.0"
description = "A personal second-monitor reference for Teamfight Tactics, built from ranked match data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.scripts]
tft = "tft_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tft_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
