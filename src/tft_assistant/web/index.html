<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Assistant</title>
<style>/*STYLE*/</style>
</head>
<body>
<aside>
  <nav id="tabs">
    <button data-view="comps" title="The comps, and one comp's page">Comps</button>
    <button data-view="items" title="Which items are safe to build early, and which units build alike">Items</button>
    <button data-view="planner" title="Build a board from the roster and see its traits and the comps it is close to">Planner</button>
    <button data-view="explorer" title="Filter every board by unit, item, trait and level, and read how units, items and traits do under the filter">Explorer</button>
  </nav>
  <div class="bar">
    <select id="selection" title="Which matches the page shows"></select>
    <div id="filters" title="Enter keeps a filter and starts another. Backspace in the empty box removes the last one.">
      <span id="chips"></span><input id="filter" type="search" placeholder="unit, trait, item or level" autocomplete="off">
    </div>
    <label title="Show each unit's name under its picture on the comp page"><input id="names" type="checkbox" checked>names</label>
  </div>
  <div id="switches">
    <label class="switch" title="List the comps that under 1 in 100 boards play"><input id="low-play" type="checkbox"><i></i><span id="low-play-label"></span></label>
    <label class="switch" title="Under each comp, list the comp with each group of units its boards add to the core"><input id="expand-all" type="checkbox"><i></i>Expand all subcomps</label>
  </div>
  <div id="head" class="comp-row"></div>
  <ol id="comps"></ol>
  <div id="slams"></div>
  <div id="roster"></div>
  <div id="explore"></div>
  <p id="health"></p>
</aside>
<div id="divider" title="Drag to resize the list, or to the left edge to hide it. Double-click to reset it."></div>
<main id="detail"></main>
<script id="snapshots" type="application/json">/*SNAPSHOTS*/</script>
<script>/*SCRIPT*/</script>
</body>
</html>
