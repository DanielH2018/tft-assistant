<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFT Assistant</title>
<style>/*STYLE*/</style>
</head>
<body>
<aside>
  <nav id="tabs">
    <button data-view="comps" title="The comps, and one comp's page">Comps</button>
    <button data-view="items" title="Which items are safe to build early, and which units build alike">Items</button>
  </nav>
  <div class="bar">
    <select id="selection" title="Which matches the page shows"></select>
    <div id="filters" title="Enter keeps a filter and starts another. Backspace in the empty box removes the last one.">
      <span id="chips"></span><input id="filter" type="search" placeholder="unit, trait, item or level" autocomplete="off">
    </div>
    <label title="Show each unit's name under its picture on the comp page"><input id="names" type="checkbox" checked>names</label>
  </div>
  <div id="categories"></div>
  <div id="head" class="comp-row"></div>
  <ol id="comps"></ol>
  <div id="slams"></div>
  <p id="health"></p>
</aside>
<div id="divider" title="Drag to resize the list, or to the left edge to hide it. Double-click to reset it."></div>
<main id="detail"></main>
<script id="snapshots" type="application/json">/*SNAPSHOTS*/</script>
<script>/*SCRIPT*/</script>
</body>
</html>
