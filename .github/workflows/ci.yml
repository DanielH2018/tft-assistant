name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/danielh2018/tft-assistant

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image is proved by what the unattended run does first: it builds a page from an empty
      # store, as a user other than the image's own, writing only under /data.
      - name: Build a page from an empty store
        run: |
          mkdir state && chmod 777 state
          docker run --rm --user 23456:23456 --read-only --tmpfs /tmp -v "$PWD/state:/data" "$IMAGE:candidate" build --out /data/site
          test -s state/site/index.html
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: github.event_name == 'push'
        run: |
          for tag in latest "sha-${GITHUB_SHA::12}"; do
            docker tag "$IMAGE:candidate" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
